<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Reset password | College Portal</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="auth-container">
    <h2>Choose a new password</h2>
    <form id="resetForm">
      <div class="form-group"><label for="password">New password</label>
        <input type="password" id="password" name="password" maxlength="72" autocomplete="new-password" required>
        <span class="hint">At least 8 characters, 1 uppercase letter and 1 number</span></div>
      <div class="form-group"><label for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" maxlength="72" autocomplete="new-password" required></div>
      <button type="submit" class="btn btn-primary btn-block">Update password</button>
    </form>
    <p id="msg" aria-live="polite"></p>
  </main>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth-pages.js"></script>
</body>
</html>

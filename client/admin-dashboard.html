<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | College Portal</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <div class="tabs">
      <button class="tab-btn active" type="button" data-tab="overview">Overview</button>
      <button class="tab-btn" type="button" data-tab="events">Events</button>
      <button class="tab-btn" type="button" data-tab="users">Users</button>
      <button class="tab-btn" type="button" data-tab="alumni">Alumni approval</button>
      <button class="tab-btn" type="button" data-tab="news">News</button>
    </div>

    <section id="tab-overview">
      <div id="stats" class="stats"></div>
    </section>

    <section id="tab-events" hidden>
      <div class="card">
        <h3 id="eventFormTitle">Create event</h3>
        <form id="eventForm">
          <div class="form-row">
            <div class="form-group"><label for="e-title">Title</label><input id="e-title" name="title" maxlength="200" required></div>
            <div class="form-group"><label for="e-category">Category</label><input id="e-category" name="category" maxlength="60" placeholder="Technical, Cultural, Sports..." required></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label for="e-date">Event date and time</label><input id="e-date" name="event_date" type="datetime-local" required></div>
            <div class="form-group"><label for="e-deadline">Registration deadline</label><input id="e-deadline" name="registration_deadline" type="datetime-local" required></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label for="e-venue">Venue</label><input id="e-venue" name="venue" maxlength="200" required></div>
            <div class="form-group"><label for="e-capacity">Capacity</label><input id="e-capacity" name="capacity" type="number" min="1" required></div>
          </div>
          <div class="form-group"><label for="e-desc">Description</label><textarea id="e-desc" name="description" maxlength="5000" required></textarea></div>
          <div class="form-group"><label for="e-banner">Banner image (optional, JPG, PNG or WEBP, max 2 MB)</label>
            <input id="e-banner" name="banner" type="file" accept="image/jpeg,image/png,image/webp"></div>
          <div class="actions">
            <button class="btn btn-primary" type="submit">Save event</button>
            <button class="btn" type="button" id="cancelEdit" hidden>Cancel edit</button>
          </div>
        </form>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Title</th><th>Date</th><th>Seats (confirmed / capacity)</th><th>Waitlist</th><th>Category</th><th>Actions</th></tr></thead>
        <tbody id="eventRows"></tbody>
      </table></div>
      <div id="eventTools" class="card" hidden>
        <h3 id="toolsTitle"></h3>
        <div class="table-wrap"><table>
          <thead><tr><th>Name</th><th>Email</th><th>College ID</th><th>Status</th><th>Registered</th></tr></thead>
          <tbody id="regRows"></tbody>
        </table></div>
        <h3>Email everyone registered for this event</h3>
        <form id="notifyForm">
          <div class="form-group"><label for="n-subject">Subject</label><input id="n-subject" name="subject" maxlength="150" required></div>
          <div class="form-group"><label for="n-message">Message</label><textarea id="n-message" name="message" maxlength="2000" required></textarea></div>
          <button class="btn btn-primary" type="submit">Send email</button>
        </form>
      </div>
    </section>

    <section id="tab-users" hidden>
      <form id="userForm" class="filters">
        <div class="form-group"><label for="u-q">Search name or email</label><input id="u-q" type="search" maxlength="100"></div>
        <div class="form-group"><label for="u-role">Role</label>
          <select id="u-role"><option value="">All roles</option><option>student</option><option>alumni</option><option>admin</option></select></div>
        <button class="btn btn-primary" type="submit">Search</button>
      </form>
      <div class="table-wrap"><table>
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Verified</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="userRows"></tbody>
      </table></div>
      <div id="userPager" class="pager"></div>
    </section>

    <section id="tab-alumni" hidden>
      <div class="filters"><div class="form-group"><label for="a-status">Show</label>
        <select id="a-status"><option value="pending">Awaiting approval</option><option value="approved">Approved</option><option value="all">All</option></select></div></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Name</th><th>Email</th><th>Degree and batch</th><th>Current role</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="alumniRows"></tbody>
      </table></div>
    </section>

    <section id="tab-news" hidden>
      <div class="card">
        <h3>Publish news</h3>
        <form id="newsForm">
          <div class="form-group"><label for="nw-title">Title</label><input id="nw-title" name="title" maxlength="200" required></div>
          <div class="form-group"><label for="nw-body">Article</label><textarea id="nw-body" name="body" maxlength="5000" required></textarea></div>
          <button class="btn btn-primary" type="submit">Publish</button>
        </form>
      </div>
      <div id="newsList" class="list"></div>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
